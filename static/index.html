<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Org · Kanban</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; } body { margin: 0; } button, input, textarea, select { font: inherit; }
    main { max-width: 1200px; margin: auto; padding: 2rem; } h1 { margin: 0; } .subtitle { color: #62708a; }
    .org-banner { display: flex; justify-content: space-between; align-items: center; gap: .8rem; background: #eef3ff; border: 1px solid #d6e1fb; border-radius: 8px; color: #40516d; font-size: .78rem; padding: .55rem .7rem; margin-bottom: 1rem; } .org-banner strong { color: #213f8a; } .org-stats { display: flex; gap: .45rem; flex-wrap: wrap; } .org-stats span + span::before { content: '•'; color: #8d99af; margin-right: .45rem; } .product-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; border-bottom: 1px solid #dce2ed; padding-bottom: 1rem; } .product-kicker { color: #315fce; font-size: .72rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 .3rem; } .product-name { font-size: 1.55rem; } .product-name span { color: #62708a; font-size: 1rem; font-weight: 600; margin-left: .4rem; } .back-link { color: #40516d; text-decoration: none; border: 1px solid #dce2ed; border-radius: 6px; padding: .5rem .7rem; font-size: .9rem; font-weight: 650; white-space: nowrap; } .back-link:hover { border-color: #315fce; color: #315fce; }
    form, .column { background: white; border: 1px solid #dce2ed; border-radius: 12px; padding: 1rem; }
    form { display: grid; gap: .7rem; margin: 1.5rem 0; } label { display: grid; gap: .25rem; font-weight: 600; }
    .filters { grid-template-columns: minmax(12rem, 2fr) repeat(2, minmax(9rem, 1fr)) auto auto; align-items: end; }
    input, textarea, select { border: 1px solid #bac4d6; border-radius: 6px; padding: .55rem; }
    button { cursor: pointer; border: 0; border-radius: 6px; padding: .55rem .8rem; background: #315fce; color: white; font-weight: 650; }
    button.secondary { background: transparent; color: #40516d; } button.danger { background: #b42341; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; } .column { min-height: 250px; background: #edf1f7; }
    .column header, .card footer, .dialog-actions { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .column h2 { margin: 0; font-size: 1rem; } .count { color: #516078; } .tasks { display: grid; gap: .65rem; margin-top: .8rem; }
    .card { background: white; border: 1px solid #dbe1ec; border-radius: 8px; padding: .75rem; } .card h3 { margin: 0 0 .35rem; }
    .card[draggable="true"] { cursor: grab; } .card.dragging { opacity: .45; } .column.drop-target { outline: 2px dashed #315fce; outline-offset: 2px; background: #e2ebff; }
    .card footer { margin-top: .7rem; } .card select { min-width: 0; }
    .empty { color: #748198; text-align: center; } .notice { padding: .75rem; background: #feecee; color: #9c1731; border-radius: 6px; }
    .account { display: flex; justify-content: flex-end; align-items: center; gap: .7rem; margin-top: -2.5rem; }
    dialog { width: min(94vw, 550px); border: 0; border-radius: 12px; padding: 1.2rem; } dialog::backdrop { background: #17203388; }
    @media (max-width: 720px) { main { padding: 1rem; } .org-banner, .product-header { align-items: stretch; flex-direction: column; } .back-link { align-self: flex-start; } .board, .filters { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="org-banner">
      <div><strong>Built by Codex Org</strong> <span class="org-stats"><span>Sprint 5</span><span>30 Git commits</span><span>7 AI Engineers</span></span></div>
      <a class="back-link" href="http://localhost:8080/dashboard/">← Return to Dashboard</a>
    </div>
    <header class="product-header">
      <div><p class="product-kicker">Codex Org Product</p><h1 class="product-name">Kanban <span>Task Workspace</span></h1><p class="subtitle">Keep the next useful thing moving.</p></div>
    </header>
    <p id="notice" class="notice" role="status" hidden></p>
    <section id="auth-panel" aria-labelledby="auth-heading"><form id="auth-form"><h2 id="auth-heading">Sign in</h2>
      <label>Username<input id="username" minlength="3" maxlength="64" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" minlength="8" maxlength="256" required autocomplete="current-password"></label>
      <button id="auth-submit">Sign in</button><button id="auth-toggle" class="secondary" type="button">Create an account</button></form></section>
    <section id="app" hidden>
      <div class="account"><span id="current-user">Signed in</span><button id="sign-out" class="secondary" type="button">Sign out</button></div>
      <form id="create-form"><label>Title<input id="new-title" maxlength="200" required placeholder="What needs to happen?"></label>
        <button>Add to Todo</button></form>
      <form id="filter-form" class="filters" aria-label="Find tasks">
        <label>Search<input id="task-query" maxlength="100" type="search" placeholder="Search titles"></label>
        <label>Status<select id="status-filter"><option value="">All statuses</option><option value="todo">Todo</option><option value="in_progress">In Progress</option><option value="done">Done</option></select></label>
        <label>Sort<select id="sort-order"><option value="created_desc">Newest first</option><option value="created_asc">Oldest first</option><option value="title_asc">Title A–Z</option><option value="title_desc">Title Z–A</option></select></label>
        <button type="submit">Apply</button><button id="clear-filters" class="secondary" type="button">Clear</button>
      </form>
      <section class="board" aria-label="Kanban board">
        <section class="column" data-status="todo"><header><h2>Todo</h2><span id="todo-count" class="count">0</span></header><div id="todo-tasks" class="tasks"></div></section>
        <section class="column" data-status="in_progress"><header><h2>In Progress</h2><span id="in_progress-count" class="count">0</span></header><div id="in_progress-tasks" class="tasks"></div></section>
        <section class="column" data-status="done"><header><h2>Done</h2><span id="done-count" class="count">0</span></header><div id="done-tasks" class="tasks"></div></section>
      </section>
    </section>
  </main>
  <dialog id="editor"><form id="edit-form"><label>Title<input id="edit-title" maxlength="200" required></label><div class="dialog-actions"><button class="secondary" type="button" id="cancel">Cancel</button><button>Save changes</button></div></form></dialog>
  <script>
    const statuses = [["todo", "Todo"], ["in_progress", "In Progress"], ["done", "Done"]];
    const notice = document.querySelector("#notice"), editor = document.querySelector("#editor");
    const authPanel = document.querySelector("#auth-panel"), app = document.querySelector("#app");
    let tasks = [], editingId = null, dragTaskId = null, authMode = "login", token = sessionStorage.getItem("kanban-token");
    function alertUser(message) { notice.textContent = message; notice.hidden = !message; }
    function showAuth(message = "") { token = null; tasks = []; sessionStorage.removeItem("kanban-token"); authPanel.hidden = false; app.hidden = true; if (editor.open) editor.close(); alertUser(message); }
    function showApp(user) { authPanel.hidden = true; app.hidden = false; document.querySelector("#current-user").textContent = user ? `Signed in as ${user.username}` : "Signed in"; }
    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(path, { ...options, headers });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        const message = body.error || "Request failed.";
        if (response.status === 401) showAuth("Your session has ended. Please sign in again.");
        throw Error(response.status === 401 ? "Your session has ended. Please sign in again." : message);
      }
      return response.status === 204 ? null : response.json();
    }
    function card(task) {
      const article = document.createElement("article"); article.className = "card"; article.draggable = true;
      article.ondragstart = event => { dragTaskId = task.id; event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", String(task.id)); article.classList.add("dragging"); };
      article.ondragend = () => { dragTaskId = null; document.querySelectorAll(".drop-target").forEach(column => column.classList.remove("drop-target")); article.classList.remove("dragging"); };
      const title = document.createElement("h3"); title.textContent = task.title; article.append(title);
      const footer = document.createElement("footer"), select = document.createElement("select");
      statuses.forEach(([key, label]) => { const option = new Option(label, key, false, key === task.status); select.add(option); });
      select.onchange = () => mutate(task.id, { status: select.value });
      const edit = document.createElement("button"); edit.className = "secondary"; edit.textContent = "Edit"; edit.onclick = () => openEditor(task);
      const remove = document.createElement("button"); remove.className = "danger"; remove.textContent = "Delete"; remove.onclick = () => removeTask(task);
      footer.append(select, edit, remove); article.append(footer); return article;
    }
    function render() {
      statuses.forEach(([key, label]) => { const column = document.querySelector(`#${key}-tasks`), items = tasks.filter(task => task.status === key); column.replaceChildren(...(items.length ? items.map(card) : [Object.assign(document.createElement("p"), { className: "empty", textContent: `No tasks ${label.toLowerCase()}.` })])); document.querySelector(`#${key}-count`).textContent = items.length; });
    }
    function taskQuery() { const params = new URLSearchParams(), search = document.querySelector("#task-query").value.trim(), status = document.querySelector("#status-filter").value, sort = document.querySelector("#sort-order").value; if (search) params.set("q", search); if (status) params.set("status", status); if (sort !== "created_desc") params.set("sort", sort); const query = params.toString(); return query ? `?${query}` : ""; }
    async function reload() { if (!token) return showAuth(); try { alertUser(""); tasks = await api(`/api/tasks${taskQuery()}`); render(); } catch (error) { alertUser(error.message); } }
    async function mutate(id, fields) { try { await api(`/api/tasks/${id}`, { method: "PATCH", body: JSON.stringify(fields) }); await reload(); return true; } catch (error) { alertUser(error.message); return false; } }
    async function optimisticMove(id, status) { const index = tasks.findIndex(task => task.id === id); if (index < 0 || tasks[index].status === status) return; const previousTasks = tasks.map(task => ({ ...task })); tasks[index] = { ...tasks[index], status }; render(); try { const updated = await api(`/api/tasks/${id}`, { method: "PATCH", body: JSON.stringify({ status }) }); tasks = tasks.map(task => task.id === id ? updated : task); render(); } catch (error) { if (!token) return; tasks = previousTasks; render(); alertUser(error.message); } }
    function openEditor(task) { editingId = task.id; document.querySelector("#edit-title").value = task.title; editor.showModal(); }
    async function removeTask(task) { if (!confirm(`Delete “${task.title}”?`)) return; try { await api(`/api/tasks/${task.id}`, { method: "DELETE" }); await reload(); } catch (error) { alertUser(error.message); } }
    function setAuthMode(mode) { authMode = mode; const register = mode === "register"; document.querySelector("#auth-heading").textContent = register ? "Create account" : "Sign in"; document.querySelector("#auth-submit").textContent = register ? "Register" : "Sign in"; document.querySelector("#auth-toggle").textContent = register ? "I already have an account" : "Create an account"; document.querySelector("#password").autocomplete = register ? "new-password" : "current-password"; alertUser(""); }
    document.querySelector("#auth-form").onsubmit = async event => { event.preventDefault(); const username = document.querySelector("#username").value.trim(), password = document.querySelector("#password").value; try { const result = await api(`/api/auth/${authMode}`, { method: "POST", body: JSON.stringify({ username, password }) }); token = result.token; sessionStorage.setItem("kanban-token", token); event.target.reset(); showApp(result.user); await reload(); } catch (error) { alertUser(error.message); } };
    document.querySelector("#auth-toggle").onclick = () => setAuthMode(authMode === "login" ? "register" : "login");
    document.querySelector("#sign-out").onclick = () => showAuth("You have signed out.");
    document.querySelector("#create-form").onsubmit = async event => { event.preventDefault(); const title = document.querySelector("#new-title").value.trim(); if (!title) return alertUser("A task title is required."); try { await api("/api/tasks", { method: "POST", body: JSON.stringify({ title }) }); event.target.reset(); await reload(); } catch (error) { alertUser(error.message); } };
    document.querySelector("#filter-form").onsubmit = event => { event.preventDefault(); reload(); };
    document.querySelector("#status-filter").onchange = reload;
    document.querySelector("#sort-order").onchange = reload;
    document.querySelector("#clear-filters").onclick = () => { document.querySelector("#filter-form").reset(); reload(); };
    document.querySelectorAll(".column[data-status]").forEach(column => { column.ondragover = event => { if (dragTaskId === null) return; event.preventDefault(); event.dataTransfer.dropEffect = "move"; column.classList.add("drop-target"); }; column.ondragleave = event => { if (!column.contains(event.relatedTarget)) column.classList.remove("drop-target"); }; column.ondrop = event => { event.preventDefault(); column.classList.remove("drop-target"); const id = dragTaskId; dragTaskId = null; if (id !== null) optimisticMove(id, column.dataset.status); }; });
    document.querySelector("#edit-form").onsubmit = async event => { event.preventDefault(); const title = document.querySelector("#edit-title").value.trim(); if (!title) return alertUser("A task title is required."); if (await mutate(editingId, { title })) editor.close(); };
    document.querySelector("#cancel").onclick = () => editor.close();
    if (token) { showApp(); reload(); } else showAuth();
  </script>
</body>
</html>
